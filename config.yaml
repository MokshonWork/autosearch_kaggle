# All knobs in one place. Secrets are NEVER in this file.
llm:
  provider: gemini        # gemini (campaign default) | groq (needs GROQ_API_KEY
                          # secret + Groq model ids in every model_* / fallback slot)
  model_ideator: gemini-2.5-flash
  model_coder: gemini-2.5-flash
  model_guard: gemini-2.5-flash
  model_analyst: gemini-2.5-flash
  model_librarian: gemini-2.5-flash
  fallback_model: gemini-3.6-flash    # 2026-10 A6 check: gemini-2.5-flash-lite now 404s
  temperatures: {ideator: 0.7, coder: 0.2, guard: 0.1, analyst: 0.3, librarian: 0.3}
  max_output_tokens: {ideator: 1200, coder: 4096, guard: 800, analyst: 800, librarian: 1500}
  timeout_s: 60
  max_retries: 2          # schema-validation retries per call
  api_key_env: GEMINI_API_KEY

budget:
  max_rounds: 20
  max_experiments: 40
  max_api_calls_total: 400
  max_tokens_total: 800000
  max_calls_per_round: 12
  wall_clock_cap_hours: 9.0
  session_margin_minutes: 45
  no_improvement_patience: 5

training:
  time_budget_s: 300
  startup_allowance_s: 420   # UNVERIFIED until Phase 1 Kaggle measurement (A8)
  dry_run_steps: 3
  seed: 42
  fp16: true
  use_compile: false

decision:
  calibration_runs: 3
  min_delta: 0.002
  confirm_marginal_wins: true
  plausibility_floor_factor: 0.7   # val_bpb below 0.7*baseline is implausible
  sanity_ceiling: 20.0

guard:
  max_edits: 8
  max_diff_lines: 60
  forbidden_added_calls: [subprocess, socket, requests, urllib, http, ftplib, shutil,
    "os.system", eval, exec, "__import__", "os.environ", "os.getenv", open_write]
  protected_files: [prepare.py, config.yaml]

dedupe:
  text_similarity_threshold: 0.85
  use_llm_judge_for_borderline: true

paths:
  repo_dir: repo
  work_dir: /kaggle/working/work
  memory_dir: /kaggle/working/memory
  results_dir: results
  stop_file: /kaggle/working/STOP

mode:
  dry_run: false
  arm: multi_agent        # multi_agent | baseline_single | baseline_sequential
