# Dry-run A/B fixture config: mock LLM + mock repo, no GPU needed.
# Generate the mock repo first: python -m src.mock_repo evals/fixtures/mock_git_repo
llm: {provider: mock}
budget: {max_rounds: 2, max_experiments: 8, max_api_calls_total: 500,
         max_tokens_total: 100000, max_calls_per_round: 30,
         wall_clock_cap_hours: 1.0, session_margin_minutes: 5,
         no_improvement_patience: 5}
training: {time_budget_s: 5, startup_allowance_s: 30, dry_run_steps: 3,
           seed: 42, fp16: true, use_compile: false}
decision: {calibration_runs: 2, min_delta: 0.002, confirm_marginal_wins: true,
           plausibility_floor_factor: 0.7, sanity_ceiling: 20.0}
guard: {max_edits: 8, max_diff_lines: 60, forbidden_added_calls: [],
        protected_files: [prepare.py]}
dedupe: {text_similarity_threshold: 0.85, use_llm_judge_for_borderline: false}
paths: {repo_dir: mock_git_repo, work_dir: work, memory_dir: memory,
        results_dir: out, stop_file: STOP}
mode: {dry_run: true, arm: multi_agent}
